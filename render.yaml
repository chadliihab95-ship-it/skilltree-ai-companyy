services:
  - type: web
    name: skilltree-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: DEEPSEEK_ENABLED
        value: "false"
      - key: CORS_ORIGIN
        value: "http://localhost:5173,http://127.0.0.1:5173,capacitor://localhost,http://localhost,https://localhost"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: static
    name: skilltree-web
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://skilltree-api-jook.onrender.com
